# PROJECT.toml — 專案 manifest(機器可讀,`proj` 指令據此做跨專案彙總)。
# user-owned:kit 永不覆蓋。狀態/指令/付費服務改變時同步本檔,並更新 updated。

name = "sekai-border"
status = "active"          # active | mvp | idle | done | paused | abandoned
                          # done = 功能完成、上線自走(仍在計費,見 [[paid]])
status_note = "子專案 2 預測上線，階段一保留前 1000 名快照;≥2 期後套 0003、202 期後套 0004"
updated = 2026-10-20       # 最後一次人工確認本檔內容的日期

[commands]                 # 只收「用它」的指令(本專案工具/服務的啟動與操作,可直接複製執行)。
# 都寫入 .env 的 SUPABASE_SCHEMA（public = 正式）;正式部署由 Cloud Scheduler 每 5 分 POST /run
once = "node index.js --once"
backfill = "node scripts/backfill.js --from 1 --to 999999"
migrate = "node scripts/migrate-legacy.js --event <id> --cutover <YYYY-MM-DDTHH:M5:00Z>"

# 付費服務皆待 user 確認實際方案/帳單
[[paid]]
service = "Supabase"       # PostgreSQL,存 sekai_border_events / sekai_border_rankings（共用專案）
billing = "free-tier"      # 待確認:個人專案推測走免費方案
monthly_est = "NT$0/月(free-tier)"
cancel = "停用 Supabase 專案或移除 Cloud Run 的 SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY"
# 待確認

[[paid]]
service = "Google Cloud"   # Cloud Run(asia-east1) + Cloud Scheduler,跑 index.js
billing = "按用量"          # 專案 sekai-archive
monthly_est = "NT$0/月,用量在免費額度內"
cancel = "刪除 Cloud Run service 與 Scheduler job"
# 用量已實測(請求數/vCPU 秒/記憶體皆遠低於免費額度,min-instances=0 無閒置計費);
# Artifact Registry 映像檔約 362MB,免費額度 500MB,超過後才開始計儲存費。
# 帳單金額本身尚未在 Billing Console 核對。
