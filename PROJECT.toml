# PROJECT.toml — 專案 manifest(機器可讀,`proj` 指令據此做跨專案彙總)。
# user-owned:kit 永不覆蓋。狀態/指令/付費服務改變時同步本檔,並更新 updated。

name = "sekai-border"
status = "done"            # active | mvp | idle | done | paused | abandoned
                          # done = 功能完成、上線自走(仍在計費,見 [[paid]])
status_note = "已上線 Cloud Run 每 5 分抓排名,兩個長期 bug 已修復並部署;無開發計畫,等活動更替或上游 API 變動再維護"
updated = 2026-07-28       # 最後一次人工確認本檔內容的日期

[commands]                 # 只收「用它」的指令(本專案工具/服務的啟動與操作,可直接複製執行)。
# 本機手動跑一次抓取(需 .env 帶 SUPABASE_URL/SUPABASE_KEY);正式部署由 Cloud Scheduler 觸發 index.js
fetch = "node fetch_all_rankings.js"

# 付費服務皆待 user 確認實際方案/帳單
[[paid]]
service = "Supabase"       # PostgreSQL,存 event_rankings 表
billing = "free-tier"      # 待確認:個人專案推測走免費方案
monthly_est = "NT$0/月(free-tier)"
cancel = "停用 Supabase 專案或移除 .env 的 SUPABASE_URL/KEY"
# 待確認

[[paid]]
service = "Google Cloud"   # Cloud Run(asia-east1) + Cloud Scheduler,跑 index.js
billing = "按用量"          # 專案 sekai-archive,帳單帳戶 01D839-F9026B-1C0C4E
monthly_est = "NT$0/月,用量在免費額度內"
cancel = "刪除 Cloud Run service 與 Scheduler job"
# 用量已實測(請求數/vCPU 秒/記憶體皆遠低於免費額度,min-instances=0 無閒置計費);
# Artifact Registry 映像檔約 362MB,免費額度 500MB,超過後才開始計儲存費。
# 帳單金額本身尚未在 Billing Console 核對。
